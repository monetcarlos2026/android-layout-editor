<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Android XML 布局可视化编辑器 v2.8.6</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="toolbar" id="mainToolbar">
  <div class="toolbar-brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12" y2="18.01"/></svg>
    LayoutEditor <span style="font-size:10px;color:var(--text-muted);font-weight:400;margin-left:4px;">v2.8.6</span>
  </div>
  <div class="toolbar-divider"></div>
  <button class="toolbar-btn" onclick="openFile()" title="打开文件">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>打开
  </button>
  <div class="toolbar-divider"></div>
  <button class="toolbar-btn" onclick="undo()" title="撤销">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>撤销
  </button>
  <button class="toolbar-btn" onclick="redo()" title="重做">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.13-9.36L23 10"/></svg>重做
  </button>
  <button class="toolbar-btn" onclick="clearAll()" title="清空画布">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>清空
  </button>
  <div class="toolbar-spacer"></div>
  <button class="toolbar-btn" onclick="exportXML()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>导出XML
  </button>
  <button class="toolbar-btn" onclick="runActivity()" title="运行Activity">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>运行Activity
  </button>
  <div class="toolbar-divider" id="fullscreenDivider"></div>
  <button class="toolbar-btn" id="fullscreenBtn" onclick="toggleBrowserFullscreen()" title="浏览器全屏">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>全屏
  </button>
</div>
<div class="main-container">
  <div class="panel-left" id="panelLeft">
    <div class="panel-section tree-section" id="treeSection">
      <div class="panel-header" onclick="toggleSection('treeSection')"><span>组件树</span><span class="section-arrow">▼</span></div>
      <div class="tree-container" id="componentTree"></div>
    </div>
    <div class="panel-section" id="componentSection">
      <div class="panel-header" style="border-top: 1px solid var(--border);" onclick="toggleSection('componentSection')"><span>组件库</span><span class="section-arrow">▼</span></div>
      <div class="panel-search"><input type="text" placeholder="搜索组件..." id="componentSearch" oninput="filterComponents(this.value)" /></div>
      <div class="component-list" id="componentList"></div>
    </div>
  </div>
  <div class="panel-center">
    <div class="center-tabs" id="centerTabs">
      <div class="tab-panel-toggle" onclick="togglePanel('left')" title="折叠/展开左侧面板"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg></div>
      <div class="tab-spacer"></div>
      <div class="center-tab active" data-tab="design" onclick="switchTab('design')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>设计</div>
      <div class="center-tab" data-tab="code" onclick="switchTab('code')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>代码</div>
      <div class="center-tab" data-tab="split" onclick="switchTab('split')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="3" x2="12" y2="21"/></svg>分屏</div>
      <div class="tab-spacer"></div>
      <div class="tab-panel-toggle" onclick="togglePanel('right')" title="折叠/展开右侧面板"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="15" y1="3" x2="15" y2="21"/></svg></div>
    </div>
    <div style="flex:1; display:flex; overflow:hidden; position:relative;">
      <div class="canvas-container" id="canvasContainer">
        <canvas id="gridCanvas" style="position:absolute;top:0;left:0;pointer-events:none;z-index:1;"></canvas>
        <div class="canvas-toolbar" id="canvasToolbar">
          <button class="toolbar-btn" id="btnRuler" onclick="toggleRuler()" title="显示/隐藏标尺"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.41 2.41 0 0 1 0-3.4l2.6-2.6a2.41 2.41 0 0 1 3.4 0Z"/><path d="m14.5 12.5 2-2"/><path d="m11.5 9.5 2-2"/><path d="m8.5 6.5 2-2"/><path d="m17.5 15.5 2-2"/></svg></button>
          <div class="canvas-toolbar-sep"></div>
          <button class="toolbar-btn" id="btnDelete" onclick="deleteSelected()" title="删除选中"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
          <button class="toolbar-btn" id="btnDuplicate" onclick="duplicateSelected()" title="复制组件"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
          <button class="toolbar-btn" id="btnMoveUp" onclick="moveUp()" title="上移"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"/></svg></button>
          <button class="toolbar-btn" id="btnMoveDown" onclick="moveDown()" title="下移"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></button>
          <div class="canvas-toolbar-sep"></div>
          <input type="text" class="ratio-input" id="zoomInput" list="zoomList" value="100%" onblur="setZoomFromInput(this.value)" onkeydown="if(event.key==='Enter'){setZoomFromInput(this.value);this.blur()}" title="缩放比例" style="width:52px;">
          <datalist id="zoomList"><option value="50%"><option value="75%"><option value="100%"><option value="125%"><option value="150%"><option value="200%"></datalist>
          <button class="toolbar-btn" onclick="fitToView()" title="自适应"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg></button>
          <div class="canvas-toolbar-sep"></div>
          <button class="toolbar-btn" onclick="toggleOrientation()" title="切换横竖屏"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="12" y1="18" x2="12" y2="18.01"/></svg></button>
          <select class="ratio-select" id="ratioSelect" onchange="setPhoneRatio(this.value)" title="切换手机比例"><option value="9-16">9:16</option><option value="3-4">3:4</option><option value="1-2">1:2</option></select>
          <div class="canvas-toolbar-sep"></div>
          <button class="toolbar-btn" id="designFullscreenBtn" onclick="toggleDesignFullscreen()" title="设计窗口全屏"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg></button>
        </div>
        <div class="phone-frame" id="phoneFrame">
          <div class="frame-coords" id="frameCoords">x: 0, y: 0</div>
          <div class="phone-status-bar"><span>9:41</span><div class="phone-notch"></div><span>📶 🔋</span></div>
          <div class="phone-content" id="phoneContent"></div>
        </div>
      </div>
      <div class="code-container" id="codeContainer">
        <div class="code-editor-wrapper">
          <div class="line-numbers" id="lineNumbers"></div>
          <div class="code-input-area"><pre class="code-highlight" id="codeHighlight"></pre><textarea class="code-editor" id="codeEditor" spellcheck="false"></textarea></div>
        </div>
      </div>
    </div>
  </div>
  <div class="panel-right" id="panelRight">
    <div class="panel-section" id="propsSection">
      <div class="panel-header" onclick="toggleSection('propsSection')"><span>属性</span><span class="section-arrow">▼</span></div>
      <div class="props-empty" id="propsEmpty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l-.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09A1.65 1.65 0 0 0 19.4 15a1.65 1.65 0 0 0 1.51 1z"/></svg><span>选择组件以编辑属性</span></div>
      <div class="props-content" id="propsContent"></div>
    </div>
  </div>
</div>
<div class="statusbar" id="statusBar"><div class="dot"></div><span id="statusText">就绪</span><span id="statusInfo">组件: 0</span><span class="status-sep">|</span><span id="statusZoom">缩放: 100%</span><span class="status-sep">|</span><span id="statusSelected">未选中</span><span class="status-sep">|</span><span id="statusView">设计视图</span><span style="flex:1"></span><span>Android XML Layout Editor v2.8.6</span></div>
<div class="toast-container" id="toastContainer"></div>
<div class="context-menu" id="contextMenu">
  <div class="context-menu-item" onclick="ctxAction('copy')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>复制组件</div>
  <div class="context-menu-item" onclick="ctxAction('up')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"/></svg>上移</div>
  <div class="context-menu-item" onclick="ctxAction('down')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>下移</div>
  <div class="context-menu-sep"></div>
  <div class="context-menu-item danger" onclick="ctxAction('delete')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>删除</div>
</div>
<input type="file" id="fileInput" accept=".xml" onchange="handleFileSelect(event)" />
<div class="pinch-indicator" id="pinchIndicator">100%</div>
<script src="app.js"></script>
</body>
</html>
